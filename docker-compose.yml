version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: cybertrap_db
    environment:
      POSTGRES_DB: ${DB_NAME:-cybertrap_db}
      POSTGRES_USER: ${DB_USER:-cybertrap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cybertrap123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybertrap"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybertrap_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cybertrap_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybertrap_network

  # Flask Web Application
  web:
    build: .
    container_name: cybertrap_web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_APP: run.py
      DATABASE_URL: postgresql://${DB_USER:-cybertrap}:${DB_PASSWORD:-cybertrap123}@db:5432/${DB_NAME:-cybertrap_db}
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key}
    ports:
      - "5000:5000"
    volumes:
      - ./:/app
      - logs:/app/logs
    networks:
      - cybertrap_network
    command: >
      sh -c "flask db upgrade &&
             gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 run:app"

  # Celery Worker
  celery_worker:
    build: .
    container_name: cybertrap_celery_worker
    depends_on:
      - redis
      - db
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-cybertrap}:${DB_PASSWORD:-cybertrap123}@db:5432/${DB_NAME:-cybertrap_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./:/app
      - logs:/app/logs
    networks:
      - cybertrap_network
    command: celery -A app.tasks.email_tasks worker -l info

  # Celery Beat (Scheduler)
  celery_beat:
    build: .
    container_name: cybertrap_celery_beat
    depends_on:
      - redis
      - db
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-cybertrap}:${DB_PASSWORD:-cybertrap123}@db:5432/${DB_NAME:-cybertrap_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./:/app
      - logs:/app/logs
    networks:
      - cybertrap_network
    command: celery -A app.tasks.email_tasks beat -l info

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cybertrap_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - cybertrap_network

networks:
  cybertrap_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  logs:
